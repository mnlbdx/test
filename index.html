<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thierry</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#f4f4f4;
      color:#111;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }
      .countdown-container{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin:50px 0;
}

.countdown-box{
    width:140px;
    padding:28px 20px;
    text-align:center;

    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.8);
    border-radius:24px;

    box-shadow:
      0 8px 30px rgba(0,0,0,0.08),
      inset 0 1px 1px rgba(255,255,255,0.7);

    transition:transform .25s ease;
}

.countdown-box:hover{
    transform:translateY(-4px);
}

.countdown-box span{
    display:block;
    font-size:54px;
    font-weight:700;
    letter-spacing:-2px;
    color:#111;
}

.countdown-box small{
    display:block;
    margin-top:8px;
    color:#888;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}
      .countdown-title{
    font-size:22px;
    font-weight:600;
    color:#111;
    margin-top:20px;
    margin-bottom:25px;
    letter-spacing:-0.5px;
}

    .container{
      width:100%;
      max-width:900px;
      background:white;
      border-radius:20px;
      padding:60px;
      box-shadow:0 10px 40px rgba(0,0,0,0.08);
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:80px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      letter-spacing:2px;
    }

    nav{
      display:flex;
      gap:30px;
    }

    nav a{
      text-decoration:none;
      color:#444;
      font-size:15px;
      transition:0.2s;
    }

    nav a:hover{
      color:black;
    }

    .hero{
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    .hero h1{
      font-size:64px;
      line-height:1.1;
      max-width:600px;
    }

    .hero p{
      color:#666;
      font-size:18px;
      line-height:1.6;
      max-width:600px;
    }
      .logo-container{
  display:flex;
  align-items:center;
  gap:12px;
}
      .hero-image{
  width:100%;
  max-width:700px;
  display:block;
  margin:10px auto 20px auto;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,0.15);
}
      .hero-image{
    width:100%;
    border-radius:28px;
    display:block;
    margin:25px 0 40px;
    box-shadow:0 20px 60px rgba(0,0,0,0.15);
}
      .countdown-box span{
    transition:all .3s ease;
}

.logo-img{
  width:100px;
  height:100px;
  object-fit:contain;
  margin-top:-2px;
}

    .buttons{
      display:flex;
      gap:15px;
      margin-top:10px;
    }

    .btn{
      padding:14px 24px;
      border-radius:10px;
      text-decoration:none;
      font-weight:bold;
      transition:0.2s;
    }

    .btn-primary{
      background:black;
      color:white;
    }

    .btn-primary:hover{
      opacity:0.9;
    }

    .btn-secondary{
      border:1px solid #ccc;
      color:#111;
      background:white;
    }

    .btn-secondary:hover{
      background:#f2f2f2;
    }

    footer{
      margin-top:80px;
      color:#777;
      font-size:14px;
      border-top:1px solid #eee;
      padding-top:25px;
    }

    @media(max-width:700px){

      .container{
        padding:35px;
      }

      header{
        flex-direction:column;
        gap:25px;
      }

      .hero h1{
        font-size:42px;
      }

      nav{
        flex-wrap:wrap;
        justify-content:center;
      }

      .buttons{
        flex-direction:column;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo-container">
  <img src="biere.png" alt="Logo Thierry" class="logo-img">
  <div class="logo">COMPTE A REBOURS</div>
      </div>

      <nav>
        <a href="#">Accueil</a>
        <a href="#">Services</a>
        <a href="#">Projets</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Sex, drogue & RocknRoll</h1>

      <p>
        Bienvenue sur le compte à rebours du bonheur. 
      </p>

        <img src="mw.jpg" alt="Le bonheur" class="hero-image">
        <div class="countdown-title">
    Temps restant avant le bonheur
</div>
        <div class="countdown-container">
  <div class="countdown-box">
    <span id="days">000</span>
    <small>Jours</small>
  </div>

  <div class="countdown-box">
    <span id="hours">00</span>
    <small>Heures</small>
  </div>

  <div class="countdown-box">
    <span id="minutes">00</span>
    <small>Minutes</small>
  </div>

  <div class="countdown-box">
    <span id="seconds">00</span>
    <small>Secondes</small>
  </div>
</div>
        
      <div class="buttons">
        <a href="#" class="btn btn-primary">Découvrir</a>
        <a href="#" class="btn btn-secondary">En savoir plus</a>
      </div>
    </section>

    <footer>
      © 2026 Manuel — Tous droits réservés
    </footer>

  </div>
<script>
const targetDate = new Date("July 3, 2026 00:00:00").getTime();

function updateCountdown() {

  const now = new Date().getTime();
  const distance = targetDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("days").innerText = days;
  document.getElementById("hours").innerText = String(hours).padStart(2, "0");
  document.getElementById("minutes").innerText = String(minutes).padStart(2, "0");
  document.getElementById("seconds").innerText = String(seconds).padStart(2, "0");

  if (distance < 0) {
    document.querySelector(".countdown-container").innerHTML =
      "<h2>🎉 Le bonheur est arrivé ! 🎉</h2>";
  }
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
